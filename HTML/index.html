<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator kontol cica</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Handwriting styles & UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@400..700&family=Gaegu:wght@400;700&family=Gochi+Hand&family=Inter:wght@300;400;500;600;700&family=Kalam:wght@300;400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- jsPDF for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Canvas Container & Shadow Styling */
        .canvas-wrapper {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-600 rounded-lg text-white">
                    <i data-lucide="pen-tool" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white leading-none">TulisTangan.id</h1>
                    <p class="text-xs text-slate-400 mt-0.5">Konversi Teks ke Tulisan Tangan Alami</p>
                </div>
            </div>

            <div class="flex items-center space-x-2 sm:space-x-3">
                <button id="btn-export-png" class="flex items-center space-x-2 px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white rounded-lg text-sm font-medium transition shadow-sm border border-slate-700">
                    <i data-lucide="image" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Unduh PNG</span>
                </button>
                <button id="btn-export-pdf" class="flex items-center space-x-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition shadow-lg shadow-indigo-600/20">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span>Ekspor PDF</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 h-full items-start">
            
            <!-- LEFT PANEL: Controls & Text Input -->
            <div class="lg:col-span-5 space-y-6">
                
                <!-- Text Input Box -->
                <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 shadow-sm">
                    <div class="flex items-center justify-between mb-3">
                        <label for="text-input" class="text-sm font-semibold text-slate-200 flex items-center gap-2">
                            <i data-lucide="file-text" class="w-4 h-4 text-indigo-400"></i>
                            Teks Masukan
                        </label>
                        <span id="char-count" class="text-xs text-slate-400">0 Karakter</span>
                    </div>
                    <textarea 
                        id="text-input" 
                        rows="7" 
                        class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-100 placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-y transition"
                        placeholder="Ketik atau tempel teks Anda di sini..."></textarea>
                    
                    <div class="flex justify-between items-center mt-3">
                        <button id="btn-sample-text" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1">
                            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                            Gunakan Contoh Teks
                        </button>
                        <button id="btn-clear-text" class="text-xs text-slate-400 hover:text-red-400 font-medium transition">
                            Hapus Semua
                        </button>
                    </div>
                </div>

                <!-- Customization Panel -->
                <div class="bg-slate-950 border border-slate-800 rounded-2xl p-5 shadow-sm space-y-5">
                    <h2 class="text-sm font-semibold text-slate-200 border-b border-slate-800 pb-3 flex items-center gap-2">
                        <i data-lucide="sliders" class="w-4 h-4 text-indigo-400"></i>
                        Pengaturan Tampilan
                    </h2>

                    <!-- Font Style Selection -->
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-2">Gaya Tulisan (Font)</label>
                        <div class="grid grid-cols-2 gap-2" id="font-options"></div>
                    </div>

                    <!-- Ink Color Selection -->
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-2">Warna Tinta / Pena</label>
                        <div class="flex items-center space-x-3" id="ink-options"></div>
                    </div>

                    <!-- Paper Style Selection -->
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-2">Jenis Kertas</label>
                        <div class="grid grid-cols-2 gap-2" id="paper-options"></div>
                    </div>

                    <!-- Font Size & Line Height Sliders -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <span class="font-medium text-slate-300">Ukuran Huruf</span>
                                <span id="val-font-size" class="text-indigo-400 font-mono">24px</span>
                            </div>
                            <input type="range" id="input-font-size" min="16" max="42" value="24" class="w-full accent-indigo-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                        </div>

                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <span class="font-medium text-slate-300">Jarak Baris</span>
                                <span id="val-line-height" class="text-indigo-400 font-mono">38px</span>
                            </div>
                            <input type="range" id="input-line-height" min="24" max="60" value="38" class="w-full accent-indigo-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>

                    <!-- Margins & Letter Spacing Controls -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <span class="font-medium text-slate-300">Margin Kiri</span>
                                <span id="val-margin-left" class="text-indigo-400 font-mono">70px</span>
                            </div>
                            <input type="range" id="input-margin-left" min="30" max="150" value="70" class="w-full accent-indigo-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                        </div>

                        <div>
                            <div class="flex justify-between text-xs mb-1">
                                <span class="font-medium text-slate-300">Margin Atas</span>
                                <span id="val-margin-top" class="text-indigo-400 font-mono">60px</span>
                            </div>
                            <input type="range" id="input-margin-top" min="30" max="150" value="60" class="w-full accent-indigo-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>

                    <!-- Handwriting Randomness Jitter -->
                    <div class="pt-2 border-t border-slate-800/80">
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-xs font-medium text-slate-300 flex items-center gap-1.5">
                                <i data-lucide="shuffle" class="w-3.5 h-3.5 text-indigo-400"></i>
                                Variasi Natural Manusia
                            </label>
                            <span id="val-randomness" class="text-indigo-400 font-mono text-xs">Sedang</span>
                        </div>
                        <input type="range" id="input-randomness" min="0" max="3" step="1" value="1" class="w-full accent-indigo-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <!-- Show Red Line Margin Toggle -->
                    <div class="flex items-center justify-between pt-2">
                        <span class="text-xs font-medium text-slate-300">Garis Pinggir Merah (Buku Tulis)</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-red-line" class="sr-only peer" checked>
                            <div class="w-9 h-5 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                        </label>
                    </div>

                </div>
            </div>

            <!-- RIGHT PANEL: Live Paper Canvas Preview -->
            <div class="lg:col-span-7 flex flex-col items-center justify-start min-h-[600px] w-full">
                
                <div class="w-full flex items-center justify-between mb-3 px-1">
                    <div class="flex items-center space-x-2 text-xs text-slate-400">
                        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span>Pratinjau Kanvas A4 (Garis & Tinta Terbawa Saat Unduh)</span>
                    </div>
                    <button id="btn-re-randomize" class="text-xs text-slate-400 hover:text-white flex items-center gap-1 bg-slate-800 px-2.5 py-1 rounded-md transition border border-slate-700">
                        <i data-lucide="rotate-cw" class="w-3 h-3"></i>
                        Acak Ulang Karakter
                    </button>
                </div>

                <!-- Canvas Wrapper -->
                <div class="w-full overflow-x-auto flex justify-center p-2 sm:p-4 bg-slate-950/50 border border-slate-800/80 rounded-2xl">
                    <canvas id="handwriting-canvas" width="794" height="1123" class="canvas-wrapper rounded-sm bg-white"></canvas>
                </div>

            </div>

        </div>
    </main>

    <script>
        // Default Sample Text matching the style of homework answer
        const SAMPLE_TEXT = `Jawaban Manajemen Keuangan
PT YUDI HANDSOME . Tbk
(31 Desember 2024)

a. Rasio Likuiditas
   1. Current ratio = Aset Lancar / Kewajiban Lancar
                   = 8.000 / 5.000`;

        // Available Handwriting Fonts (Including print handwriting matching the photo)
        const FONTS = [
            { id: 'Patrick Hand', name: 'Patrick (Cetak Rapi)', family: "'Patrick Hand', cursive" },
            { id: 'Gaegu', name: 'Gaegu (Cetak Bersih)', family: "Gaegu, cursive" },
            { id: 'Architects Daughter', name: 'Architects (Tegak)', family: "'Architects Daughter', cursive" },
            { id: 'Gochi Hand', name: 'Gochi (Gaya Pensil)', family: "'Gochi Hand', cursive" },
            { id: 'Caveat', name: 'Caveat (Natural)', family: "Caveat, cursive" },
            { id: 'Kalam', name: 'Kalam (Rapi)', family: "Kalam, cursive" }
        ];

        // Available Ink Colors
        const INK_COLORS = [
            { id: 'black', name: 'Tinta Hitam', hex: '#1a1a1a' },
            { id: 'blue', name: 'Tinta Biru', hex: '#1d3557' },
            { id: 'pencil', name: 'Pensil Abu', hex: '#4a5568' },
            { id: 'red', name: 'Tinta Merah', hex: '#991b1b' }
        ];

        // Available Paper Background Styles
        const PAPER_STYLES = [
            { id: 'lined', name: 'Buku Bergaris' },
            { id: 'white', name: 'HVS Polos' },
            { id: 'grid', name: 'Buku Kotak' },
            { id: 'vintage', name: 'Kertas Vintage' }
        ];

        // State Management
        let state = {
            text: SAMPLE_TEXT,
            font: FONTS[0].id,
            ink: INK_COLORS[0].hex,
            paper: PAPER_STYLES[0].id,
            fontSize: 24,
            lineHeight: 38,
            marginLeft: 70,
            marginTop: 60,
            randomness: 1, // 0: None, 1: Low, 2: Medium, 3: High
            showRedLine: true,
            seed: Math.random()
        };

        // DOM Elements
        const textInput = document.getElementById('text-input');
        const charCount = document.getElementById('char-count');
        const fontOptionsContainer = document.getElementById('font-options');
        const inkOptionsContainer = document.getElementById('ink-options');
        const paperOptionsContainer = document.getElementById('paper-options');
        const canvas = document.getElementById('handwriting-canvas');
        const ctx = canvas.getContext('2d');

        // Input Controls
        const inputFontSize = document.getElementById('input-font-size');
        const inputLineHeight = document.getElementById('input-line-height');
        const inputMarginLeft = document.getElementById('input-margin-left');
        const inputMarginTop = document.getElementById('input-margin-top');
        const inputRandomness = document.getElementById('input-randomness');
        const toggleRedLine = document.getElementById('toggle-red-line');

        // Value Display Labels
        const valFontSize = document.getElementById('val-font-size');
        const valLineHeight = document.getElementById('val-line-height');
        const valMarginLeft = document.getElementById('val-margin-left');
        const valMarginTop = document.getElementById('val-margin-top');
        const valRandomness = document.getElementById('val-randomness');

        // Seeded Pseudo-Random Generator
        function pseudoRandom(s) {
            const x = Math.sin(s++) * 10000;
            return x - Math.floor(x);
        }

        // Render Canvas Background Lines directly into Canvas
        function drawCanvasBackground() {
            const width = canvas.width;
            const height = canvas.height;

            // 1. Base Fill Color
            if (state.paper === 'vintage') {
                ctx.fillStyle = '#f4ecd8';
            } else if (state.paper === 'lined') {
                ctx.fillStyle = '#fdfbf7';
            } else {
                ctx.fillStyle = '#ffffff';
            }
            ctx.fillRect(0, 0, width, height);

            // 2. Vintage Texture Effect
            if (state.paper === 'vintage') {
                ctx.fillStyle = 'rgba(180, 150, 100, 0.05)';
                for (let i = 0; i < 400; i++) {
                    const rx = Math.random() * width;
                    const ry = Math.random() * height;
                    const rw = Math.random() * 4 + 1;
                    ctx.fillRect(rx, ry, rw, rw);
                }
            }

            // 3. Horizontal Lines for Lined Paper
            if (state.paper === 'lined') {
                ctx.strokeStyle = '#a8c5da';
                ctx.lineWidth = 1;
                
                let y = state.marginTop;
                while (y < height) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                    ctx.stroke();
                    y += state.lineHeight;
                }
            }

            // 4. Grid Pattern for Box/Grid Paper
            if (state.paper === 'grid') {
                ctx.strokeStyle = '#e2e8f0';
                ctx.lineWidth = 1;
                const gridSize = 28;

                for (let x = 0; x < width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, height);
                    ctx.stroke();
                }
                for (let y = 0; y < height; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(width, y);
                    ctx.stroke();
                }
            }

            // 5. Vertical Red Margin Line for Notebooks
            if (state.paper === 'lined' && state.showRedLine) {
                const redX = Math.max(state.marginLeft - 20, 20);
                ctx.strokeStyle = '#f87171';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(redX, 0);
                ctx.lineTo(redX, height);
                ctx.stroke();
            }
        }

        // Render Handwritten Text onto Canvas with jitter
        function drawCanvasText() {
            const selectedFont = FONTS.find(f => f.id === state.font) || FONTS[0];
            ctx.font = `${state.fontSize}px ${selectedFont.family}`;
            ctx.fillStyle = state.ink;
            ctx.textBaseline = 'alphabetic';

            const lines = textInput.value.split('\n');
            let currentY = state.marginTop - (state.fontSize * 0.15);
            let localSeed = state.seed;

            lines.forEach((line) => {
                if (line.length === 0) {
                    currentY += state.lineHeight;
                    return;
                }

                let currentX = state.marginLeft;

                for (let i = 0; i < line.length; i++) {
                    const char = line[i];

                    const charWidth = ctx.measureText(char).width;

                    if (currentX + charWidth > canvas.width - 30) {
                        currentX = state.marginLeft;
                        currentY += state.lineHeight;
                    }

                    ctx.save();

                    let rot = 0;
                    let offsetY = 0;
                    let offsetX = 0;

                    if (state.randomness > 0) {
                        const factor = state.randomness * 0.7;
                        rot = (pseudoRandom(localSeed++) - 0.5) * (0.05 * factor);
                        offsetY = (pseudoRandom(localSeed++) - 0.5) * (2.0 * factor);
                        offsetX = (pseudoRandom(localSeed++) - 0.5) * (1.2 * factor);
                    }

                    ctx.translate(currentX + offsetX, currentY + offsetY);
                    ctx.rotate(rot);

                    ctx.fillText(char, 0, 0);

                    ctx.restore();

                    currentX += charWidth + offsetX;
                }

                currentY += state.lineHeight;
            });
        }

        function renderFullCanvas() {
            document.fonts.ready.then(() => {
                drawCanvasBackground();
                drawCanvasText();
            });
        }

        function initControls() {
            fontOptionsContainer.innerHTML = FONTS.map(f => `
                <button type="button" data-font="${f.id}" class="btn-font border border-slate-800 bg-slate-900 hover:border-slate-700 p-2.5 rounded-xl text-left transition flex flex-col justify-between h-16 ${state.font === f.id ? 'ring-2 ring-indigo-500 border-transparent bg-slate-800/80' : ''}">
                    <span class="text-[10px] text-slate-400 block">${f.name}</span>
                    <span style="font-family: ${f.family}; font-size: 16px;" class="text-slate-100 truncate">Aa Bb Cc 123</span>
                </button>
            `).join('');

            inkOptionsContainer.innerHTML = INK_COLORS.map(c => `
                <button type="button" data-ink="${c.hex}" class="btn-ink w-8 h-8 rounded-full border-2 transition-all flex items-center justify-center ${state.ink === c.hex ? 'border-white scale-110 shadow-lg' : 'border-transparent hover:scale-105'}" style="background-color: ${c.hex}" title="${c.name}">
                    ${state.ink === c.hex ? '<i data-lucide="check" class="w-4 h-4 text-white"></i>' : ''}
                </button>
            `).join('');

            paperOptionsContainer.innerHTML = PAPER_STYLES.map(p => `
                <button type="button" data-paper="${p.id}" class="btn-paper border border-slate-800 bg-slate-900 hover:border-slate-700 p-2.5 rounded-xl text-xs font-medium text-slate-300 text-center transition ${state.paper === p.id ? 'ring-2 ring-indigo-500 border-transparent bg-slate-800' : ''}">
                    ${p.name}
                </button>
            `).join('');

            textInput.value = state.text;
            updateCharCount();

            lucide.createIcons();
        }

        function updateCharCount() {
            charCount.textContent = `${textInput.value.length} Karakter`;
        }

        function setupEventListeners() {
            textInput.addEventListener('input', (e) => {
                state.text = e.target.value;
                updateCharCount();
                renderFullCanvas();
            });

            fontOptionsContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.btn-font');
                if (!btn) return;
                state.font = btn.dataset.font;
                initControls();
                renderFullCanvas();
            });

            inkOptionsContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.btn-ink');
                if (!btn) return;
                state.ink = btn.dataset.ink;
                initControls();
                renderFullCanvas();
            });

            paperOptionsContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.btn-paper');
                if (!btn) return;
                state.paper = btn.dataset.paper;
                initControls();
                renderFullCanvas();
            });

            inputFontSize.addEventListener('input', (e) => {
                state.fontSize = parseInt(e.target.value);
                valFontSize.textContent = `${state.fontSize}px`;
                renderFullCanvas();
            });

            inputLineHeight.addEventListener('input', (e) => {
                state.lineHeight = parseInt(e.target.value);
                valLineHeight.textContent = `${state.lineHeight}px`;
                renderFullCanvas();
            });

            inputMarginLeft.addEventListener('input', (e) => {
                state.marginLeft = parseInt(e.target.value);
                valMarginLeft.textContent = `${state.marginLeft}px`;
                renderFullCanvas();
            });

            inputMarginTop.addEventListener('input', (e) => {
                state.marginTop = parseInt(e.target.value);
                valMarginTop.textContent = `${state.marginTop}px`;
                renderFullCanvas();
            });

            inputRandomness.addEventListener('input', (e) => {
                state.randomness = parseInt(e.target.value);
                const labels = ['Mati', 'Rendah', 'Sedang', 'Tinggi'];
                valRandomness.textContent = labels[state.randomness];
                renderFullCanvas();
            });

            toggleRedLine.addEventListener('change', (e) => {
                state.showRedLine = e.target.checked;
                renderFullCanvas();
            });

            document.getElementById('btn-re-randomize').addEventListener('click', () => {
                state.seed = Math.random();
                renderFullCanvas();
            });

            document.getElementById('btn-sample-text').addEventListener('click', () => {
                textInput.value = SAMPLE_TEXT;
                state.text = SAMPLE_TEXT;
                updateCharCount();
                renderFullCanvas();
            });

            document.getElementById('btn-clear-text').addEventListener('click', () => {
                textInput.value = '';
                state.text = '';
                updateCharCount();
                renderFullCanvas();
            });

            document.getElementById('btn-export-png').addEventListener('click', () => {
                renderFullCanvas();
                const link = document.createElement('a');
                link.download = `tulisan-tangan-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });

            document.getElementById('btn-export-pdf').addEventListener('click', () => {
                renderFullCanvas();
                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });

                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

                pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                pdf.save(`catatan-tulisan-tangan-${Date.now()}.pdf`);
            });
        }

        window.onload = () => {
            initControls();
            setupEventListeners();
            document.fonts.ready.then(() => {
                renderFullCanvas();
            });
        };
    </script>
</body>
</html>
